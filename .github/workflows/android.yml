name: Build WinLite 10 Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Show tool versions
        run: |
          java -version
          gradle --version
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK for artifact
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/WinLite10.apk
          sha256sum release/WinLite10.apk | tee release/SHA256SUMS.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinLite10-APK
          path: |
            release/WinLite10.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
